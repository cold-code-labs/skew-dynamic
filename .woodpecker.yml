# Single CI definition (Woodpecker). Push/manual only: the repo is public and secrets must
# never reach fork pull requests. Deploy = Cloudflare Workers Static Assets from main.
when:
  - event: [push, manual]

steps:
  - name: study-tests
    image: python:3.13-slim
    commands:
      - pip install --quiet -r study/requirements.txt -r study/api/requirements.txt pytest
      - (cd study && python -c "import skewlib.exante, skewlib.skewmeter, skewlib.model, skewlib.canonical; print('skewlib OK')")
      - (cd study && python -m pytest tests/ api/test_api.py -q)

  - name: site
    image: node:22-bookworm-slim
    depends_on: []
    commands:
      - corepack enable
      - (cd site && pnpm install --frozen-lockfile && pnpm build)
      - test -f site/dist/index.html && test -f site/dist/_headers

  - name: gitleaks
    image: alpine:3.21@sha256:ce64758a109eb420d874a118f87920e625e12d3634e03b4a5573fd9f6e5d3507
    depends_on: []
    commands:
      - apk add --no-cache curl tar git
      - curl -sSfL -o /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
      - echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
      - tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - /tmp/gitleaks git --no-banner --redact

  - name: deploy
    image: node:22-bookworm-slim
    depends_on: [study-tests, site, gitleaks]
    when:
      - branch: main
        event: [push, manual]
    environment:
      CLOUDFLARE_API_TOKEN:
        from_secret: cloudflare_api_token
      CLOUDFLARE_ACCOUNT_ID:
        from_secret: cloudflare_account_id
      # The Cloudflare token is locked to the fleet's IPv4 egress.
      NODE_OPTIONS: --dns-result-order=ipv4first
    commands:
      - npx --yes wrangler@4.152.0 deploy
